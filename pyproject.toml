[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcgbm"
version = "1.0.0"
description = "Dependency-free Monte Carlo simulation of geometric Brownian motion (GBM) paths"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["monte-carlo", "geometric-brownian-motion", "gbm", "simulation", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
mcgbm = "mcgbm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools]
packages = ["mcgbm"]

[tool.pytest.ini_options]
# Only the tests/ directory is collected: the repository also contains a
# placeholder file at the root that is not valid Python.
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["mcgbm", "examples"]
